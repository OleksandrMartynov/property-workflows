# Серверні межі (ADR 0006) — окремий workflow, як вимагає AGENTS.md для нових перевірок: секретний ключ і admin-клієнт
# лише в серверному коді; кожна Server Action перевіряє вхід (getClaims) до першого запису. Скрипти без залежностей.
name: server-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server-boundary:
    name: "Секретний ключ лише на сервері"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Матеріали курсу WS7 (materials/scripts/check-server-boundary.mjs): SUPABASE_SECRET_KEY лише в admin.ts.
      - run: node scripts/check-server-boundary.mjs

  actions-auth:
    name: "Кожна Server Action перевіряє вхід"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # ADR 0006: getClaims() (прямо чи через requireViewer / requireAdmin) у кожній дії; без getSession() і middleware.ts.
      - run: node scripts/check-actions-auth.mjs
