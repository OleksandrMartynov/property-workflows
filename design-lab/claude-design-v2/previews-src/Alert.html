<!-- @dsCard group="Status" height=190 subtitle="Alert: error, success, info" -->
<style>
.alerts { display: flex; flex-direction: column; gap: var(--space-3); max-width: 560px; }
.alert {
  display: flex; align-items: flex-start; gap: var(--space-2-5);
  border: 1px solid transparent; border-radius: var(--radius-md); padding: var(--space-2-5) var(--space-3);
  font-size: 14px; line-height: 20px; letter-spacing: -0.006em;
}
.alert > div { min-width: 0; flex: 1; }
.a-error { border-color: color-mix(in oklab, var(--status-overdue-mark) 30%, transparent); background: var(--status-overdue); color: var(--status-overdue-foreground); }
.a-success { border-color: color-mix(in oklab, var(--status-done-mark) 30%, transparent); background: var(--status-done); color: var(--status-done-foreground); }
.a-info { border-color: color-mix(in oklab, var(--status-progress-mark) 30%, transparent); background: var(--status-progress); color: var(--status-progress-foreground); }
</style>
<div class="alerts">
  <div class="alert a-error" role="alert">{{si overdue lg}}<div>Invalid email or password.</div></div>
  <div class="alert a-success" role="status">{{si done lg}}<div>Run launched.</div></div>
  <div class="alert a-info" role="status">{{si progress lg}}<div>Draft saved.</div></div>
</div>
