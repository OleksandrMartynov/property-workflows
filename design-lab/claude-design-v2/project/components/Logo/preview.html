<!-- @dsCard group="Brand" height=306 subtitle="Echo Roof: знак і лок-ап, колір — currentColor" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=JetBrains+Mono:wght@100..800&display=swap">
<style>
:root, [data-theme] {
  /* Похідні токени: color-mix у oklab, як у globals.css (у tokens.json їх немає) */
  --state-hover: color-mix(in oklab, var(--foreground) 5%, transparent);
  --state-pressed: color-mix(in oklab, var(--foreground) 8%, transparent);
  --state-selected: color-mix(in oklab, var(--primary) 10%, transparent);
  --primary-hover: color-mix(in oklab, var(--primary), var(--foreground) 10%);
  --primary-active: color-mix(in oklab, var(--primary), var(--foreground) 18%);
  --destructive-hover: color-mix(in oklab, var(--destructive), var(--foreground) 10%);
  /* Похідні токени контролів форм (globals.css, розділ «Контролі форм») */
  --accent-float: color-mix(in oklab, var(--popover), var(--foreground) 7%);
  --primary-tint: color-mix(in oklch, var(--primary) 12%, transparent);
  --primary-tint-strong: color-mix(in oklch, var(--primary) 22%, transparent);
  --match: color-mix(in oklch, var(--primary) 20%, transparent);
  --destructive-tint: color-mix(in oklch, var(--destructive) 10%, transparent);
  --done-tint: color-mix(in oklch, var(--status-done) 14%, transparent);
  --control-off: color-mix(in oklab, var(--muted), var(--foreground) 6%);
  --control-disabled-fill: color-mix(in oklab, var(--muted-foreground), var(--background) 62%);
  --glass-bg: color-mix(in oklch, var(--popover) var(--glass-alpha), transparent);
  /* Локальні для controls.css: межа поля на hover і пружина з легким перельотом (лише малі перемикачі) */
  --border-hover: color-mix(in oklab, var(--input), var(--foreground) 14%);
  --spring-bouncy: linear(0, 0.015 2%, 0.07 4.5%, 0.169 7.5%, 0.594 18%, 0.731 22%, 0.841 26%, 0.923 30%, 0.986 34.5%, 1.026 39.5%, 1.045 46%, 1.035 57.5%, 1.002 79.5%, 1);
  --spring-bouncy-duration: 360ms;
  --weight-body: 400;
}
[data-theme="dark"] { --weight-body: 420; }
*, *::before, *::after { box-sizing: border-box; border-color: var(--border); }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; padding: var(--space-4);
  background: var(--background); color: var(--foreground);
  font-family: var(--font-sans); font-size: 14px; line-height: 20px; letter-spacing: -0.006em;
  font-weight: var(--weight-body); font-optical-sizing: auto; font-synthesis: none; text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
p { text-wrap: pretty; }
button, input, select, textarea { font: inherit; letter-spacing: inherit; color: inherit; margin: 0; }
button { cursor: default; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; }
:focus { outline: none; }
:focus-visible { outline: var(--ring-width) solid var(--ring); outline-offset: var(--ring-offset); }
::placeholder { color: var(--muted-foreground); opacity: 1; }

/* Шкала тексту: display · title · heading · body · label · meta */
.t-display { font-size: 28px; line-height: 32px; letter-spacing: -0.03em; font-weight: 600; }
.t-title { font-size: 20px; line-height: 28px; letter-spacing: -0.016em; font-weight: 600; }
.t-heading { font-size: 15px; line-height: 20px; letter-spacing: -0.008em; font-weight: 600; }
.t-body { font-size: 14px; line-height: 20px; letter-spacing: -0.006em; }
.t-label { font-size: 13px; line-height: 18px; font-weight: 500; }
.t-meta { font-size: 12px; line-height: 16px; letter-spacing: 0.004em; }
.tabular { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.muted { color: var(--muted-foreground); }
.cap { font-size: 12px; line-height: 16px; letter-spacing: 0.004em; color: var(--muted-foreground); margin: 0 0 var(--space-2); }
.sec { display: flex; flex-direction: column; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.stack { display: flex; flex-direction: column; gap: var(--space-5); }

/* Іконки статусів (14px; lg — 16px, як в Alert) */
.si { width: 14px; height: 14px; flex-shrink: 0; }
.si.lg { width: 16px; height: 16px; margin-top: 2px; }
.si-todo { color: var(--status-todo-mark); }
.si-progress { color: var(--status-progress-mark); }
.si-done { color: var(--status-done-mark); }
.si-overdue { color: var(--status-overdue-mark); }
.si-due-soon { color: var(--status-due-soon-mark); }

/* Аватар: ініціал + тон за хешем адреси */
.avatar { display: inline-grid; width: 20px; height: 20px; flex-shrink: 0; place-items: center; border-radius: var(--radius-pill); font-size: 10px; line-height: 1; font-weight: 600; }
.avatar.tone-0 { background: var(--status-progress); color: var(--status-progress-foreground); }
.avatar.tone-1 { background: var(--status-done); color: var(--status-done-foreground); }
.avatar.tone-2 { background: var(--status-due-soon); color: var(--status-due-soon-foreground); }
.avatar.tone-3 { background: var(--ai); color: var(--ai-foreground); }
.avatar.tone-4 { background: var(--variable); color: var(--variable-foreground); }

.ring { width: 16px; height: 16px; flex-shrink: 0; }
.ring.lg { width: 24px; height: 24px; }
.avstack { display: inline-flex; align-items: center; }
.avatar.stacked { box-shadow: 0 0 0 2px var(--card); }
.avatar.overlap { margin-left: -6px; }
.avstack .more { margin-left: var(--space-1); font-size: 12px; line-height: 16px; letter-spacing: 0.004em; font-weight: 500; color: var(--muted-foreground); }

.g { width: 16px; height: 16px; flex: none; }
.g.sm { width: 12px; height: 12px; }
.g.xs { width: 10px; height: 10px; }
@keyframes ui-spin { to { transform: rotate(360deg); } }
.g-spin { animation: ui-spin 800ms linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 1600ms !important; transition-duration: 1ms !important; } }
</style>
<style>
.logo { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--foreground); }
.logo .mark { width: 20px; height: 20px; flex-shrink: 0; color: var(--primary); }
.logo-name { font-size: 15px; line-height: 20px; font-weight: 600; letter-spacing: -0.025em; }
.mark { flex-shrink: 0; }
.s16 { width: 16px; height: 16px; }
.s20 { width: 20px; height: 20px; }
.s24 { width: 24px; height: 24px; }
.s32 { width: 32px; height: 32px; }
.s48 { width: 48px; height: 48px; }
.ink-primary { color: var(--primary); }
.ink-foreground { color: var(--foreground); }
.ink-sidebar { color: var(--sidebar-foreground); }
.chip { display: inline-grid; place-items: center; border-radius: var(--radius-sm); padding: var(--space-3); }
.on-sidebar { background: var(--sidebar); border: 1px solid var(--sidebar-border); }
.tile { display: grid; width: 64px; height: 64px; place-items: center; border-radius: 14px; background: var(--primary); color: var(--primary-foreground); box-shadow: var(--elevation-1); }
.tile .mark { width: 36px; height: 36px; }
.sizes { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-5); }
.one { display: flex; flex-direction: column; align-items: center; gap: var(--space-1-5); }
</style>
</head>
<body>
<div class="stack">
  <section class="sec">
    <p class="cap">Logo: mark in primary plus the product name</p>
    <span class="logo"><svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 22V12L12 3L21 12V22" stroke="currentColor" stroke-width="2"/><path d="M7 22V13.66L12 8.66L17 13.66V22" stroke="currentColor" stroke-width="2"/><path d="M10 22V14.9L12 12.9L14 14.9V22Z" fill="currentColor"/></svg><span class="logo-name">Property Workflows</span></span>
  </section>
  <section class="sec">
    <p class="cap">Mark: grid 16 and 20 are pixel-aligned, 24 scales up. Never shrink 24 to 16</p>
    <div class="sizes">
      <div class="one"><svg class="mark s16 ink-primary" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 15V8L8 2L14 8V15" stroke="currentColor" stroke-width="2"/><path d="M5 15V9L8 6L11 9V15Z" fill="currentColor"/></svg><span class="cap" style="margin:0">16</span></div>
      <div class="one"><svg class="mark s20 ink-primary" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2 19V10L10 2L18 10V19" stroke="currentColor" stroke-width="2"/><path d="M6 19V11.66L10 7.66L14 11.66V19" stroke="currentColor" stroke-width="2"/><path d="M9 19V12.9L10 11.9L11 12.9V19Z" fill="currentColor"/></svg><span class="cap" style="margin:0">20</span></div>
      <div class="one"><svg class="mark s24 ink-primary" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 22V12L12 3L21 12V22" stroke="currentColor" stroke-width="2"/><path d="M7 22V13.66L12 8.66L17 13.66V22" stroke="currentColor" stroke-width="2"/><path d="M10 22V14.9L12 12.9L14 14.9V22Z" fill="currentColor"/></svg><span class="cap" style="margin:0">24</span></div>
      <div class="one"><svg class="mark s32 ink-primary" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 22V12L12 3L21 12V22" stroke="currentColor" stroke-width="2"/><path d="M7 22V13.66L12 8.66L17 13.66V22" stroke="currentColor" stroke-width="2"/><path d="M10 22V14.9L12 12.9L14 14.9V22Z" fill="currentColor"/></svg><span class="cap" style="margin:0">32</span></div>
      <div class="one"><svg class="mark s48 ink-primary" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 22V12L12 3L21 12V22" stroke="currentColor" stroke-width="2"/><path d="M7 22V13.66L12 8.66L17 13.66V22" stroke="currentColor" stroke-width="2"/><path d="M10 22V14.9L12 12.9L14 14.9V22Z" fill="currentColor"/></svg><span class="cap" style="margin:0">48</span></div>
    </div>
  </section>
  <section class="sec">
    <p class="cap">One ink only: primary · foreground · sidebar-foreground · primary-foreground on a primary tile</p>
    <div class="row" style="gap: var(--space-4)">
      <span class="chip"><svg class="mark s32 ink-primary" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 22V12L12 3L21 12V22" stroke="currentColor" stroke-width="2"/><path d="M7 22V13.66L12 8.66L17 13.66V22" stroke="currentColor" stroke-width="2"/><path d="M10 22V14.9L12 12.9L14 14.9V22Z" fill="currentColor"/></svg></span>
      <span class="chip"><svg class="mark s32 ink-foreground" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 22V12L12 3L21 12V22" stroke="currentColor" stroke-width="2"/><path d="M7 22V13.66L12 8.66L17 13.66V22" stroke="currentColor" stroke-width="2"/><path d="M10 22V14.9L12 12.9L14 14.9V22Z" fill="currentColor"/></svg></span>
      <span class="chip on-sidebar"><svg class="mark s32 ink-sidebar" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 22V12L12 3L21 12V22" stroke="currentColor" stroke-width="2"/><path d="M7 22V13.66L12 8.66L17 13.66V22" stroke="currentColor" stroke-width="2"/><path d="M10 22V14.9L12 12.9L14 14.9V22Z" fill="currentColor"/></svg></span>
      <span class="tile"><svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 22V12L12 3L21 12V22" stroke="currentColor" stroke-width="2"/><path d="M7 22V13.66L12 8.66L17 13.66V22" stroke="currentColor" stroke-width="2"/><path d="M10 22V14.9L12 12.9L14 14.9V22Z" fill="currentColor"/></svg></span>
    </div>
  </section>
</div>
</body>
</html>
