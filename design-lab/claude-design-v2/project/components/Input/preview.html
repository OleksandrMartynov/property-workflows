<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=JetBrains+Mono:wght@100..800&display=swap">
<style>
:root, [data-theme] {
  /* Похідні токени: color-mix у oklab, як у globals.css (у tokens.json їх немає) */
  --state-hover: color-mix(in oklab, var(--foreground) 5%, transparent);
  --state-pressed: color-mix(in oklab, var(--foreground) 8%, transparent);
  --state-selected: color-mix(in oklab, var(--primary) 10%, transparent);
  --primary-hover: color-mix(in oklab, var(--primary), var(--foreground) 10%);
  --primary-active: color-mix(in oklab, var(--primary), var(--foreground) 18%);
  --destructive-hover: color-mix(in oklab, var(--destructive), var(--foreground) 10%);
  /* Похідні токени контролів форм (globals.css, розділ «Контролі форм») */
  --accent-float: color-mix(in oklab, var(--popover), var(--foreground) 7%);
  --primary-tint: color-mix(in oklch, var(--primary) 12%, transparent);
  --primary-tint-strong: color-mix(in oklch, var(--primary) 22%, transparent);
  --match: color-mix(in oklch, var(--primary) 20%, transparent);
  --destructive-tint: color-mix(in oklch, var(--destructive) 10%, transparent);
  --done-tint: color-mix(in oklch, var(--status-done) 14%, transparent);
  --control-off: color-mix(in oklab, var(--muted), var(--foreground) 6%);
  --control-disabled-fill: color-mix(in oklab, var(--muted-foreground), var(--background) 62%);
  --glass-bg: color-mix(in oklch, var(--popover) var(--glass-alpha), transparent);
  /* Локальні для controls.css: межа поля на hover і пружина з легким перельотом (лише малі перемикачі) */
  --border-hover: color-mix(in oklab, var(--input), var(--foreground) 14%);
  --spring-bouncy: linear(0, 0.015 2%, 0.07 4.5%, 0.169 7.5%, 0.594 18%, 0.731 22%, 0.841 26%, 0.923 30%, 0.986 34.5%, 1.026 39.5%, 1.045 46%, 1.035 57.5%, 1.002 79.5%, 1);
  --spring-bouncy-duration: 360ms;
  --weight-body: 400;
}
[data-theme="dark"] { --weight-body: 420; }
*, *::before, *::after { box-sizing: border-box; border-color: var(--border); }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; padding: var(--space-4);
  background: var(--background); color: var(--foreground);
  font-family: var(--font-sans); font-size: 14px; line-height: 20px; letter-spacing: -0.006em;
  font-weight: var(--weight-body); font-optical-sizing: auto; font-synthesis: none; text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
p { text-wrap: pretty; }
button, input, select, textarea { font: inherit; letter-spacing: inherit; color: inherit; margin: 0; }
button { cursor: default; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; }
:focus { outline: none; }
:focus-visible { outline: var(--ring-width) solid var(--ring); outline-offset: var(--ring-offset); }
::placeholder { color: var(--muted-foreground); opacity: 1; }

/* Шкала тексту: display · title · heading · body · label · meta */
.t-display { font-size: 28px; line-height: 32px; letter-spacing: -0.03em; font-weight: 600; }
.t-title { font-size: 20px; line-height: 28px; letter-spacing: -0.016em; font-weight: 600; }
.t-heading { font-size: 15px; line-height: 20px; letter-spacing: -0.008em; font-weight: 600; }
.t-body { font-size: 14px; line-height: 20px; letter-spacing: -0.006em; }
.t-label { font-size: 13px; line-height: 18px; font-weight: 500; }
.t-meta { font-size: 12px; line-height: 16px; letter-spacing: 0.004em; }
.tabular { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.muted { color: var(--muted-foreground); }
.cap { font-size: 12px; line-height: 16px; letter-spacing: 0.004em; color: var(--muted-foreground); margin: 0 0 var(--space-2); }
.sec { display: flex; flex-direction: column; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.stack { display: flex; flex-direction: column; gap: var(--space-5); }

/* Іконки статусів (14px; lg — 16px, як в Alert) */
.si { width: 14px; height: 14px; flex-shrink: 0; }
.si.lg { width: 16px; height: 16px; margin-top: 2px; }
.si-todo { color: var(--status-todo-mark); }
.si-progress { color: var(--status-progress-mark); }
.si-done { color: var(--status-done-mark); }
.si-overdue { color: var(--status-overdue-mark); }
.si-due-soon { color: var(--status-due-soon-mark); }

/* Аватар: ініціал + тон за хешем адреси */
.avatar { display: inline-grid; width: 20px; height: 20px; flex-shrink: 0; place-items: center; border-radius: var(--radius-pill); font-size: 10px; line-height: 1; font-weight: 600; }
.avatar.tone-0 { background: var(--status-progress); color: var(--status-progress-foreground); }
.avatar.tone-1 { background: var(--status-done); color: var(--status-done-foreground); }
.avatar.tone-2 { background: var(--status-due-soon); color: var(--status-due-soon-foreground); }
.avatar.tone-3 { background: var(--ai); color: var(--ai-foreground); }
.avatar.tone-4 { background: var(--variable); color: var(--variable-foreground); }

.ring { width: 16px; height: 16px; flex-shrink: 0; }
.ring.lg { width: 24px; height: 24px; }
.avstack { display: inline-flex; align-items: center; }
.avatar.stacked { box-shadow: 0 0 0 2px var(--card); }
.avatar.overlap { margin-left: -6px; }
.avstack .more { margin-left: var(--space-1); font-size: 12px; line-height: 16px; letter-spacing: 0.004em; font-weight: 500; color: var(--muted-foreground); }

.g { width: 16px; height: 16px; flex: none; }
.g.sm { width: 12px; height: 12px; }
.g.xs { width: 10px; height: 10px; }
@keyframes ui-spin { to { transform: rotate(360deg); } }
.g-spin { animation: ui-spin 800ms linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 1600ms !important; transition-duration: 1ms !important; } }
</style>
<style>
/* Спільне для прев'ю контролів форм: Field, поле, оболонка, плаваюча поверхня, рядки списку.
   Дзеркало controls.css / select-family.css / date-time.css із src/components/ui; лише токени. */
.field { display: flex; min-width: 0; flex-direction: column; }
.fhead { display: flex; min-height: 18px; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-1-5); }
.lbl { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--foreground); }
.req { margin-left: 2px; font-weight: 600; color: var(--destructive); }
.opt { font-size: 12px; line-height: 16px; letter-spacing: 0.004em; color: var(--muted-foreground); }
.foot { display: flex; align-items: flex-start; gap: var(--space-3); }
.msg { min-width: 0; flex: 1; }
.error { display: flex; align-items: flex-start; gap: var(--space-1-5); padding-top: var(--space-1-5); font-size: 12px; line-height: 16px; letter-spacing: 0.004em; color: var(--destructive); }
.error .g { width: 14px; height: 14px; margin-top: 1px; }
.hint { padding-top: var(--space-1-5); font-size: 12px; line-height: 16px; letter-spacing: 0.004em; color: var(--muted-foreground); }
.counter { flex: none; padding-top: var(--space-1-5); font-size: 12px; line-height: 16px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.counter.near { color: var(--status-due-soon-foreground); }
.counter.over { color: var(--destructive); }
.gridf { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--space-5) var(--space-6); align-items: start; }

/* Поле: межа input, заливка field; hover темнить межу, focus — межа ring + outline усередину */
.ctl { position: relative; }
.control, .trigger {
  display: block; width: 100%; height: var(--size-control); padding: 0 var(--space-3);
  border: 1px solid var(--input); border-radius: var(--radius-sm); background: var(--field); color: var(--foreground);
  font-size: 14px; line-height: 20px; letter-spacing: -0.006em; caret-color: var(--primary);
  transition: color var(--duration-fast) var(--ease-standard), background-color var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard);
}
.control:hover:not(:disabled), .is-hover { border-color: var(--border-hover); }
.control:focus-visible, .control.is-focus, .trigger:focus-visible, .trigger.is-focus { border-color: var(--ring); outline: var(--ring-width) solid var(--ring); outline-offset: -1px; }
.control[aria-invalid="true"], .trigger[aria-invalid="true"], .shell[data-invalid] { border-color: var(--destructive); }
.control[aria-invalid="true"].is-focus, .shell[data-invalid].is-focus { outline-color: var(--destructive); }
.control:disabled, .trigger:disabled, .shell[data-disabled] { cursor: not-allowed; border-color: var(--border); background: var(--muted); color: var(--muted-foreground); }
.control:disabled::placeholder { color: var(--control-disabled-fill); }
.control[readonly] { background: color-mix(in oklab, var(--muted) 50%, transparent); }
.control.lg { height: 2.75rem; }
.pr1 { padding-right: 2.25rem; }
.pr2 { padding-right: 3.75rem; }
.pr3 { padding-right: 5.25rem; }
.pl-lead { padding-left: 2.25rem; }
textarea.control { height: auto; padding-top: var(--space-2); padding-bottom: var(--space-2); resize: none; }
.slot { position: absolute; inset: 0 var(--space-1) 0 auto; display: flex; align-items: center; gap: 2px; }
.lead { position: absolute; left: var(--space-3); top: 50%; translate: 0 -50%; display: grid; color: var(--muted-foreground); pointer-events: none; }
.glyph { display: inline-grid; width: var(--size-hit); height: var(--size-hit); flex: none; place-items: center; }
.g-alert { color: var(--destructive); }
.iconbtn { display: inline-grid; width: var(--size-hit); height: var(--size-hit); flex: none; place-items: center; border-radius: var(--radius-xs); color: var(--muted-foreground); transition: background-color var(--duration-instant) var(--ease-standard), color var(--duration-instant) var(--ease-standard); }
.iconbtn:hover, .iconbtn.is-hover { background: var(--state-hover); color: var(--foreground); }
.iconbtn[aria-expanded="true"] { background: var(--primary-tint); color: var(--primary); }
.iconbtn:disabled { color: var(--control-disabled-fill); }

/* Тригер Select: кнопка-комбобокс з шевроном */
.trigger { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding-right: var(--space-2); text-align: left; }
.trigger .val { display: flex; min-width: 0; flex: 1; align-items: center; gap: var(--space-2); }
.trigger .val > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trigger .ph { color: var(--muted-foreground); }
.trigger .tail { display: flex; flex: none; align-items: center; gap: var(--space-1-5); }
.chev { display: inline-grid; flex: none; place-items: center; color: var(--muted-foreground); transition: transform var(--spring-snappy-duration) var(--spring-snappy); }
.chev.up, [aria-expanded="true"] .chev { transform: rotate(180deg); color: var(--foreground); }
.dot { width: 8px; height: 8px; flex: none; border-radius: var(--radius-pill); background: var(--status-progress-mark); }

/* Оболонка поля з вбудованим input (Combobox, MultiSelect) */
.shell {
  position: relative; display: flex; min-height: var(--size-control); min-width: 0; align-items: center; gap: var(--space-1-5);
  padding: 0 var(--space-2) 0 var(--space-3); border: 1px solid var(--input); border-radius: var(--radius-sm); background: var(--field); color: var(--foreground);
  font-size: 14px; line-height: 20px; letter-spacing: -0.006em;
}
.shell:hover:not([data-disabled]) { border-color: var(--border-hover); }
.shell.is-open { border-color: var(--ring); }
.shell.is-focus { border-color: var(--ring); outline: var(--ring-width) solid var(--ring); outline-offset: 0; }
.shell .in { min-width: 0; flex: 1 1 auto; align-self: stretch; border: 0; background: none; padding: 0; color: inherit; }
.shell .in:focus-visible { outline: none; }
.shell .in::placeholder { color: var(--muted-foreground); }
.shell .in:disabled { cursor: not-allowed; }
.shell .avatar { width: 20px; height: 20px; font-size: 10px; }
.multi { flex-wrap: wrap; align-content: center; gap: var(--space-1); padding: var(--space-1) var(--space-2) var(--space-1) var(--space-1-5); }
.multi .in { flex: 1 1 4rem; min-width: 4rem; height: var(--size-chip); align-self: auto; padding: 0 var(--space-1); }
.multi > .chev { margin-left: auto; }
.chip {
  display: inline-flex; height: var(--size-chip); max-width: 100%; flex: none; align-items: center; gap: 2px; white-space: nowrap;
  padding: 0 2px 0 var(--space-2); border-radius: var(--radius-pill); background: var(--secondary); color: var(--secondary-foreground);
  box-shadow: inset 0 0 0 1px var(--border); font-size: 12px; line-height: 1; letter-spacing: 0.004em; font-weight: 500;
}
.chip.av { padding-left: 2px; }
.chip .avatar { width: 18px; height: 18px; font-size: 9px; }
.chip .av-name { padding-left: var(--space-1); }
.chip .x { display: inline-grid; width: 18px; height: 18px; place-items: center; border-radius: var(--radius-pill); color: var(--muted-foreground); }
.chip .x:hover { background: var(--state-pressed); color: var(--foreground); }
.more { display: inline-flex; height: var(--size-chip); flex: none; align-items: center; padding: 0 var(--space-2); border-radius: var(--radius-pill); background: var(--control-off); color: var(--foreground); font-size: 12px; line-height: 1; font-weight: 500; font-variant-numeric: tabular-nums; }
.shell[data-disabled] .chip { background: transparent; padding-right: var(--space-2); color: var(--muted-foreground); }

/* Плаваюча скляна поверхня: .float (surface-float) */
.float {
  background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur)) saturate(1.4); -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
  border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--elevation-3); color: var(--popover-foreground);
}
.lb { padding: var(--space-1); }
.lb-search { display: flex; align-items: center; gap: var(--space-2); margin: calc(var(--space-1) * -1) calc(var(--space-1) * -1) var(--space-1); padding: 0 var(--space-3); border-bottom: 1px solid var(--border); color: var(--muted-foreground); }
.lb-search .in { height: 36px; min-width: 0; flex: 1; border: 0; background: transparent; padding: 0; color: var(--foreground); font-size: 14px; line-height: 20px; letter-spacing: -0.006em; }
.lb-search .in:focus-visible { outline: none; }
.lb-search .in::placeholder { color: var(--muted-foreground); }
.grp + .grp { margin-top: var(--space-1); padding-top: var(--space-1); border-top: 1px solid var(--border); }
.grp-l { padding: var(--space-2) var(--space-2) var(--space-1); font-size: 12px; line-height: 16px; letter-spacing: 0.004em; font-weight: 500; color: var(--muted-foreground); }
.o {
  position: relative; display: flex; min-height: var(--size-option); align-items: center; gap: var(--space-2); padding: 0 var(--space-2);
  border-radius: var(--radius-xs); font-size: 13px; line-height: 18px; font-weight: 500; color: var(--popover-foreground);
}
.o.rich { min-height: var(--size-option-rich); padding-top: var(--space-1); padding-bottom: var(--space-1); }
.o[data-active] { background: var(--accent-float); }
.o[aria-disabled="true"] { color: var(--muted-foreground); }
.o .lead-n { display: inline-grid; flex: none; place-items: center; color: var(--muted-foreground); }
.o .txt { display: grid; min-width: 0; flex: 1; }
.o .txt > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.o .desc { font-size: 12px; line-height: 16px; letter-spacing: 0.004em; font-weight: 400; color: var(--muted-foreground); }
.o[data-active] .desc { color: color-mix(in oklab, var(--foreground) 70%, transparent); }
.o .tail { margin-left: auto; display: flex; flex: none; align-items: center; gap: var(--space-2); }
.o .tick { color: var(--primary); opacity: 0; transform: scale(0.6); }
.o[aria-selected="true"] .tick { opacity: 1; transform: none; }
mark { border-radius: 2px; background: var(--match); padding: 0 1px; color: var(--foreground); }
.o .avatar { width: 24px; height: 24px; font-size: 11px; }
.empty-l { display: grid; justify-items: center; gap: var(--space-1); padding: var(--space-5) var(--space-4); text-align: center; }
.empty-l .g { width: 20px; height: 20px; color: var(--muted-foreground); margin-bottom: var(--space-1); }
.empty-l b { font-size: 13px; line-height: 18px; font-weight: 500; }
.role {
  display: inline-flex; height: 20px; align-items: center; gap: var(--space-1); white-space: nowrap; border-radius: var(--radius-pill); padding: 0 var(--space-2) 0 var(--space-1-5);
  font-size: 12px; line-height: 16px; letter-spacing: 0.004em; font-weight: 500;
}
.role .g { width: 12px; height: 12px; }
.role-admin { background: var(--status-progress); color: var(--status-progress-foreground); }
.role-manager { background: var(--secondary); color: var(--secondary-foreground); }
/* Контейнер, у якому «плаває» поверхня в статичному прев'ю */
.anchor { position: relative; }
.anchor > .float { margin-top: var(--space-1-5); }
.box { display: grid; width: var(--size-check); height: var(--size-check); flex: none; place-items: center; border-radius: var(--radius-xs); color: var(--primary-foreground); box-shadow: inset 0 0 0 1.5px var(--border-strong); }
.box svg { width: 12px; height: 12px; }
.box path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
[role="option"][aria-selected="true"] .box { background: var(--primary); box-shadow: inset 0 0 0 1.5px var(--primary); }
[role="option"][aria-selected="true"] .box path { stroke-dashoffset: 0; }
[role="option"][data-active]:not([aria-selected="true"]) .box { box-shadow: inset 0 0 0 1.5px var(--foreground); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-6); align-items: start; }
.col { display: flex; flex-direction: column; gap: var(--space-4); }
.caps-note { display: flex; align-items: center; gap: var(--space-1-5); padding-top: var(--space-1-5); font-size: 12px; line-height: 16px; letter-spacing: 0.004em; color: var(--status-due-soon-foreground); }
.caps-note .g { width: 14px; height: 14px; }
.warn { color: var(--status-due-soon-foreground); }
</style>
</head>
<body>
<div class="cols">
  <div class="col">
    <p class="cap">Text: counter, search, optional, hover, focus, invalid, read-only</p>
    <div class="field">
      <div class="fhead"><label class="lbl" for="in-case">Case name<span class="req" aria-hidden="true">*</span></label></div>
      <div class="ctl">
        <input class="control pr1" id="in-case" type="text" value="Apartment 12, move-in" aria-required="true">
        <span class="slot"><button class="iconbtn" type="button" aria-label="Clear" title="Clear"><svg class="g g-close sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>
      </div>
      <div class="foot"><div class="msg"></div><span class="counter" aria-hidden="true">21/100</span></div>
    </div>
    <div class="field">
      <div class="fhead"><label class="lbl" for="in-search">Search tasks</label></div>
      <div class="ctl">
        <span class="lead" aria-hidden="true"><svg class="g g-search" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="M10.25 10.25l3 3"/></svg></span>
        <input class="control pl-lead pr1" id="in-search" type="search" role="searchbox" value="keys" autocomplete="off">
        <span class="slot"><button class="iconbtn" type="button" aria-label="Clear search" title="Clear search"><svg class="g g-close sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>
      </div>
    </div>
    <div class="field">
      <div class="fhead"><label class="lbl" for="in-opt">Tenant email</label><span class="opt">Optional</span></div>
      <input class="control" id="in-opt" type="email" placeholder="tenant@example.test">
    </div>
    <div class="field">
      <div class="fhead"><label class="lbl" for="in-hover">Email</label></div>
      <input class="control is-hover" id="in-hover" type="email" value="alex@example.test">
    </div>
    <div class="field">
      <div class="fhead"><label class="lbl" for="in-focus">Email</label></div>
      <input class="control is-focus" id="in-focus" type="email" value="alex@example.test">
    </div>
    <div class="field">
      <div class="fhead"><label class="lbl" for="in-invalid">Email<span class="req" aria-hidden="true">*</span></label></div>
      <div class="ctl">
        <input class="control pr2" id="in-invalid" type="email" value="ana@" aria-invalid="true" aria-describedby="in-invalid-e">
        <span class="slot"><span class="glyph"><svg class="g g-alert" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke-width="1.6"/><path d="M8 4.8v3.6" stroke-width="1.6"/><circle cx="8" cy="11" r="0.9" fill="currentColor" stroke="none"/></svg></span><button class="iconbtn" type="button" aria-label="Clear" title="Clear"><svg class="g g-close sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>
      </div>
      <div class="foot"><div class="msg"><p class="error" id="in-invalid-e" role="alert"><svg class="g g-alert" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke-width="1.6"/><path d="M8 4.8v3.6" stroke-width="1.6"/><circle cx="8" cy="11" r="0.9" fill="currentColor" stroke="none"/></svg><span>Enter a valid email.</span></p></div></div>
    </div>
    <div class="field">
      <div class="fhead"><label class="lbl" for="in-ro">Unit</label></div>
      <input class="control" id="in-ro" type="text" value="Apartment 12" readonly>
    </div>
    <div class="field">
      <div class="fhead"><label class="lbl" for="in-dis">Manager</label></div>
      <input class="control" id="in-dis" type="email" value="manager@example.test" disabled>
    </div>
  </div>

  <div class="col">
    <p class="cap">Textarea: grows with text, no resize grip; PasswordInput; size lg</p>
    <div class="field">
      <div class="fhead"><label class="lbl" for="in-notes">Notes</label><span class="opt">Optional</span></div>
      <textarea class="control" id="in-notes" rows="3" style="height: 4.75rem">Collect keys from the manager.
Check the meters.
Photograph every room.</textarea>
      <div class="foot"><div class="msg"></div><span class="counter" aria-hidden="true">77/120</span></div>
    </div>
    <div class="field">
      <div class="fhead"><label class="lbl" for="in-comment">Comment<span class="req" aria-hidden="true">*</span></label></div>
      <textarea class="control" id="in-comment" rows="2" aria-invalid="true" aria-describedby="in-comment-e" placeholder="Why was it rejected?" style="height: 3.25rem"></textarea>
      <div class="foot"><div class="msg"><p class="error" id="in-comment-e" role="alert"><svg class="g g-alert" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke-width="1.6"/><path d="M8 4.8v3.6" stroke-width="1.6"/><circle cx="8" cy="11" r="0.9" fill="currentColor" stroke="none"/></svg><span>Add a short comment.</span></p></div><span class="counter" aria-hidden="true">0/120</span></div>
    </div>
    <div class="field">
      <div class="fhead"><label class="lbl" for="in-pw">Password</label></div>
      <div class="ctl">
        <input class="control pr1" id="in-pw" type="password" value="example-pass" autocomplete="current-password">
        <span class="slot"><button class="iconbtn" type="button" aria-label="Show password" aria-pressed="false" title="Show password"><svg class="g g-eye-off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 8s2.3-4.5 6.5-4.5S14.5 8 14.5 8s-2.3 4.5-6.5 4.5S1.5 8 1.5 8z"/><circle cx="8" cy="8" r="1.9" transform="translate(8 8) scale(.75) translate(-8 -8)"/><path d="M3 13 13 3"/></svg></button></span>
      </div>
    </div>
    <div class="field">
      <div class="fhead"><label class="lbl" for="in-pw2">Password</label></div>
      <div class="ctl">
        <input class="control lg pr2" id="in-pw2" type="text" value="example-pass" autocomplete="current-password">
        <span class="slot"><span class="glyph warn" title="Caps Lock is on"><svg class="g g-caps" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5l4.5 5H10v3H6v-3H3.5z"/><path d="M6 13.25h4"/></svg></span><button class="iconbtn" type="button" aria-label="Hide password" aria-pressed="true" title="Hide password"><svg class="g g-eye" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 8s2.3-4.5 6.5-4.5S14.5 8 14.5 8s-2.3 4.5-6.5 4.5S1.5 8 1.5 8z"/><circle cx="8" cy="8" r="1.9"/></svg></button></span>
      </div>
      <p class="caps-note" role="status" aria-live="polite">Caps Lock is on.</p>
    </div>
    <div class="field">
      <div class="fhead"><label class="lbl" for="in-pw3">Password</label></div>
      <div class="ctl">
        <input class="control lg pr3" id="in-pw3" type="password" aria-invalid="true" aria-describedby="in-pw3-e">
        <span class="slot"><span class="glyph"><svg class="g g-alert" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke-width="1.6"/><path d="M8 4.8v3.6" stroke-width="1.6"/><circle cx="8" cy="11" r="0.9" fill="currentColor" stroke="none"/></svg></span><button class="iconbtn" type="button" aria-label="Show password" aria-pressed="false" title="Show password"><svg class="g g-eye-off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 8s2.3-4.5 6.5-4.5S14.5 8 14.5 8s-2.3 4.5-6.5 4.5S1.5 8 1.5 8z"/><circle cx="8" cy="8" r="1.9" transform="translate(8 8) scale(.75) translate(-8 -8)"/><path d="M3 13 13 3"/></svg></button></span>
      </div>
      <div class="foot"><div class="msg"><p class="error" id="in-pw3-e" role="alert"><svg class="g g-alert" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke-width="1.6"/><path d="M8 4.8v3.6" stroke-width="1.6"/><circle cx="8" cy="11" r="0.9" fill="currentColor" stroke="none"/></svg><span>Enter your password.</span></p></div></div>
    </div>
  </div>
</div>
</body>
</html>
